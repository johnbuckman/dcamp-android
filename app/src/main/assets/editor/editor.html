<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<link rel="stylesheet" href="trix.css">
<script src="trix.js"></script>
<script>
  (function () {   // host palette from ?theme=dark&ink=RRGGBB&… (applied before first paint)
    var q = new URLSearchParams(location.search), r = document.documentElement;
    if (q.get("theme") === "dark") r.setAttribute("data-theme", "dark");
    ["ink", "soft", "panel", "line", "link", "accent"].forEach(function (k) {
      var v = q.get(k); if (v && /^[0-9a-f]{6}$/i.test(v)) r.style.setProperty("--dc-" + k, "#" + v);
    });
  })();
</script>
<style>
  /* Theme comes from the HOST, not prefers-color-scheme: the Android window theme is light,
     so the WebView always reports light even when Compose draws dark (→ black text on the
     dark panel). The host passes its palette in the URL query and via dcampSetTheme(). */
  :root { color-scheme: light; --dc-ink: #1c1c1c; --dc-soft: #6b6b6b; --dc-panel: #ffffff;
    --dc-line: #ddd5c7; --dc-link: #1f6fd6; --dc-accent: #16a34a; }
  :root[data-theme=dark] { color-scheme: dark; }
  html, body, trix-editor { color: var(--dc-ink); }
  trix-editor a, .trix-content a { color: var(--dc-link); }
  trix-editor ::selection { background: color-mix(in srgb, var(--dc-link) 35%, transparent); }
  /* trix.css is light-only: re-point its fixed colours at the palette */
  trix-toolbar .trix-button { color: var(--dc-ink); border-color: var(--dc-line) !important; }
  trix-toolbar .trix-button.trix-active { background: color-mix(in srgb, var(--dc-link) 28%, var(--dc-panel)); color: var(--dc-ink); }
  trix-toolbar .trix-button--icon:not(:disabled)::before { opacity: .7; }
  trix-toolbar .trix-button--icon.trix-active::before { opacity: 1; }
  :root[data-theme=dark] trix-toolbar .trix-button--icon::before { filter: invert(1); }
  trix-toolbar .trix-button-group { border-color: var(--dc-line); }
  trix-toolbar .trix-dialog { background: var(--dc-panel); color: var(--dc-ink);
    border-top-color: var(--dc-line); box-shadow: 0 0.3em 1em rgba(0,0,0,.35); }
  trix-toolbar .trix-input--dialog { background-color: var(--dc-panel); color: var(--dc-ink); border-color: var(--dc-line); }
  .trix-content blockquote { border-color: var(--dc-line); }
  .trix-content pre { background-color: color-mix(in srgb, var(--dc-ink) 8%, var(--dc-panel)); color: var(--dc-ink); }
  .trix-content .attachment--preview .attachment__caption, .trix-content .attachment--file { color: var(--dc-soft); border-color: var(--dc-line); }
  trix-editor .trix-button--remove { background-color: var(--dc-panel); }
  html, body { margin: 0; padding: 0; height: 100%;
    font: -apple-system-body; background: transparent;
    -webkit-text-size-adjust: 100%; }
  body { display: flex; flex-direction: column; }
  form { display: flex; flex-direction: column; flex: 1 1 auto; min-height: 0; margin: 0; }
  /* Formatting toolbar lives at the BOTTOM of the composer (right above the keyboard) so
     Android's system text-selection menu — which pops above the selection — lands in the
     empty content area, not over the toolbar buttons. */
  trix-toolbar { position: sticky; bottom: 0; z-index: 2; order: 2;
    background: var(--dc-panel); padding: 4px 6px;
    border-top: 1px solid color-mix(in srgb, var(--dc-ink) 15%, transparent); }
  /* drop Trix's built-in file button — the app provides its own "Attach image" button that
     posts to the host (native photo picker). NOTE the hyphens: Trix's real class names. */
  trix-toolbar .trix-button-group--file-tools,
  trix-toolbar .trix-button--icon-attach { display: none; }
  /* The editor scrolls inside itself, so once the host's height cap is reached the text
     never runs under the toolbar. */
  trix-editor { border: none; min-height: 44px; padding: 12px 14px; overflow-y: auto;
    font: -apple-system-body; outline: none; order: 1; flex: 1 1 auto; }
  trix-editor:empty:not(:focus)::before { color: color-mix(in srgb, var(--dc-ink) 40%, transparent); }
  /* our injected toolbar buttons (HR + colour) match Trix's built-in buttons */
  .trix-hr-btn, .dc-color-btn { font-size: 15px; line-height: 1; }
  /* colour + highlight swatch popover, anchored just under the sticky toolbar */
  .dc-color-pop { position: absolute; left: 4px; z-index: 10; display: none;
    background: var(--dc-panel); color: var(--dc-ink); border-radius: 10px; padding: 7px 9px;
    border: 1px solid color-mix(in srgb, var(--dc-ink) 20%, transparent);
    box-shadow: 0 6px 20px rgba(0,0,0,.18); }
  .dc-color-pop.open { display: block; }
  .dc-color-pop .dc-row { display: flex; align-items: center; gap: 7px; margin: 3px 0; }
  .dc-color-pop .dc-cue { width: 15px; text-align: center; font: 600 12px -apple-system; opacity: .55; }
  .dc-sw { width: 20px; height: 20px; border-radius: 50%; cursor: pointer; padding: 0;
    border: 1px solid color-mix(in srgb, var(--dc-ink) 25%, transparent); }
  .dc-color-pop .dc-clear { margin-left: 4px; font: 12px -apple-system; background: none;
    border: 0; color: inherit; text-decoration: underline; cursor: pointer; padding: 2px 4px; }
  .dc-color-btn svg, .trix-table-btn svg { vertical-align: middle; }
  /* table-insert modal */
  .dc-modal-back { position: fixed; inset: 0; z-index: 50; background: rgba(0,0,0,.28);
    display: flex; align-items: center; justify-content: center; padding: 8px; }
  .dc-modal { background: var(--dc-panel); color: var(--dc-ink); border-radius: 14px; padding: 16px;
    width: min(92vw, 460px); box-shadow: 0 12px 40px rgba(0,0,0,.3);
    display: flex; flex-direction: column; max-height: 100%; }
  .dc-modal-title { font: 700 16px -apple-system; margin-bottom: 12px; }
  .dc-modal-ctrls { display: flex; flex-wrap: wrap; gap: 12px; align-items: center;
    font: 13px -apple-system; margin-bottom: 12px; }
  .dc-stepper b { display: inline-block; min-width: 20px; text-align: center; }
  .dc-stepper button { width: 26px; height: 26px; border-radius: 6px; margin: 0 3px;
    border: 1px solid color-mix(in srgb, var(--dc-ink) 22%, transparent); background: var(--dc-panel); color: inherit; font-size: 15px; cursor: pointer; }
  /* Only the cell grid scrolls; title, Rows/Cols steppers and Cancel/Insert stay pinned. */
  .dc-tgrid { display: grid; gap: 5px; margin-bottom: 14px; min-height: 0; overflow-y: auto; }
  .dc-tcell { padding: 7px 8px; font: 14px -apple-system; border-radius: 6px;
    border: 1px solid color-mix(in srgb, var(--dc-ink) 20%, transparent); background: var(--dc-panel); color: inherit; min-width: 0; }
  .dc-tcell.dc-th { font-weight: 700; }
  .dc-modal-act { display: flex; justify-content: flex-end; gap: 10px; }
  .dc-btn { padding: 8px 16px; border-radius: 8px; font: 600 14px -apple-system; cursor: pointer;
    border: 1px solid color-mix(in srgb, var(--dc-ink) 20%, transparent); background: var(--dc-panel); color: inherit; }
  .dc-btn-primary { background: #16a34a; border-color: #16a34a; color: #fff; }
</style>
<form>
  <input id="content" type="hidden" name="content">
  <trix-editor input="content" placeholder="Write…"></trix-editor>
</form>
<script>
  var editorEl = document.querySelector("trix-editor");
  var input = document.getElementById("content");

  function post(msg) {
    if (window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.composer) {
      window.webkit.messageHandlers.composer.postMessage(msg);
    } else if (window.AndroidComposer && window.AndroidComposer.post) {
      try { window.AndroidComposer.post(JSON.stringify(msg)); } catch (e) {}
    }
  }

  // Notify Swift as content changes (so it can enable/disable Post) and report the
  // editor's natural content height so the inline composer can auto-grow (#9).
  function contentHeight() {
    // trix-editor's own scrollHeight = the rendered text height (excludes the toolbar).
    return Math.ceil(editorEl.scrollHeight || 0);
  }
  editorEl.addEventListener("trix-change", function () {
    post({ type: "change", html: input.value, length: editorEl.editor.getDocument().toString().trim().length, height: contentHeight() });
  });
  // In a TALL host (full-screen ComposeView) let the editor fill the space so the
  // whole area is tappable; in a SHORT host (inline chat/DM composer) keep it compact
  // (min-height 44) so the SwiftUI frame can auto-grow with the content (#9).
  function fitEditor() {
    var toolbarH = editorEl.toolbarElement ? editorEl.toolbarElement.offsetHeight : 0;
    var avail = window.innerHeight - toolbarH;
    editorEl.style.minHeight = (avail > 360 ? Math.max(44, avail - 16) : 44) + "px";
  }
  window.addEventListener("resize", fitEditor);
  // Android: pull the saved draft and load it BEFORE reporting ready (host pushes raced the init).
  function pullDraft() {
    try {
      if (window.AndroidComposer && window.AndroidComposer.draft) {
        var d = window.AndroidComposer.draft();
        if (d) editorEl.editor.loadHTML(d);
      }
    } catch (e) {}
  }
  // Trix can finish initialising BEFORE this script runs (the element above is upgraded as soon
  // as it's parsed), and then "trix-initialize" never reaches us: no "ready" to the host, no draft
  // restore, no draft saving, no custom toolbar buttons. Run init once, from whichever comes first.
  var dcInited = false;
  function onTrixInit() {
    if (dcInited) return; dcInited = true;
    pullDraft(); post({ type: "ready" }); buildToolbar(); addLinkDialogButtons(); fitEditor(); post({ type: "change", html: input.value, length: 0, height: contentHeight() });
  }
  editorEl.addEventListener("trix-initialize", onTrixInit);   // (+ catch-up call at the end of this script)

  // ⌘↵ / Ctrl+↵ submits (matches the web's bindCmdEnter).
  editorEl.addEventListener("keydown", function (e) {
    if ((e.metaKey || e.ctrlKey) && e.key === "Enter") { e.preventDefault(); post({ type: "submit" }); }
  });

  function esc(s) {
    return (s == null ? "" : String(s)).replace(/[&<>"]/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c];
    });
  }

  // --- text colour + highlight (fgColor/bgColor Trix attrs, matches dcamp.js) ---
  try {
    Trix.config.textAttributes.fgColor = {
      styleProperty: "color", inheritable: true,
      parser: function (el) { return el.style && el.style.color ? el.style.color : undefined; }
    };
    Trix.config.textAttributes.bgColor = {
      styleProperty: "backgroundColor", inheritable: true,
      parser: function (el) { return el.style && el.style.backgroundColor ? el.style.backgroundColor : undefined; }
    };
  } catch (e) {}
  // Swift calls this from the native colour popover. null clears that channel.
  window.dcampSetColor = function (fg, bg) {
    var ed = editorEl.editor;
    if (fg) { ed.activateAttribute("fgColor", fg); } else { ed.deactivateAttribute("fgColor"); }
    if (bg) { ed.activateAttribute("bgColor", bg); } else { ed.deactivateAttribute("bgColor"); }
    editorEl.focus();
  };
  window.dcampClearColor = function () {
    var ed = editorEl.editor; ed.deactivateAttribute("fgColor"); ed.deactivateAttribute("bgColor"); editorEl.focus();
  };
  // Insert a horizontal rule (Trix has no HR block → content-attachment, like the web).
  window.dcampInsertHR = function () {
    try { editorEl.editor.insertAttachment(new Trix.Attachment({ content: "<hr>", contentType: "application/vnd.trix.horizontal-rule" })); editorEl.editor.insertLineBreak(); } catch (e) {}
    editorEl.focus();
  };

  // Insert a table via a compact editor modal.  Trix has no table model, so — like
  // the web dcamp composer — it is stored as an opaque content-attachment
  // (contentType application/vnd.dcamp.table + <table> html) that the native
  // TrixTableView renders.
  var TABLE_CT = "application/vnd.dcamp.table";
  function tableHtml(rows, header) {
    var h = "<table><tbody>";
    for (var r = 0; r < rows.length; r++) {
      h += "<tr>";
      var tag = (header && r === 0) ? "th" : "td";
      for (var c = 0; c < rows[r].length; c++) {
        h += "<" + tag + ">" + esc(rows[r][c] || "").replace(/\n/g, "<br>") + "</" + tag + ">";
      }
      h += "</tr>";
    }
    return h + "</tbody></table>";
  }
  function openTableEditor() {
    var rows = 2, cols = 2, header = true, data = [];
    var back = document.createElement("div"); back.className = "dc-modal-back";
    var box = document.createElement("div"); box.className = "dc-modal"; back.appendChild(box);
    function readBack() {
      var inps = box.querySelectorAll(".dc-tcell"); data = []; var k = 0;
      for (var r = 0; r < rows; r++) { data[r] = []; for (var c = 0; c < cols; c++) { data[r][c] = inps[k] ? inps[k].value : ""; k++; } }
    }
    function render() {
      box.innerHTML = "";
      var title = document.createElement("div"); title.className = "dc-modal-title"; title.textContent = "Insert table"; box.appendChild(title);
      var ctrls = document.createElement("div"); ctrls.className = "dc-modal-ctrls";
      ctrls.innerHTML = '<label><input type="checkbox" class="dc-thead"' + (header ? " checked" : "") + "> Header row</label>";
      var sr = document.createElement("span"); sr.className = "dc-stepper";
      sr.innerHTML = 'Rows <button type="button" data-a="r-">–</button><b>' + rows + '</b><button type="button" data-a="r+">+</button>';
      var sc = document.createElement("span"); sc.className = "dc-stepper";
      sc.innerHTML = 'Cols <button type="button" data-a="c-">–</button><b>' + cols + '</b><button type="button" data-a="c+">+</button>';
      ctrls.appendChild(sr); ctrls.appendChild(sc); box.appendChild(ctrls);
      var grid = document.createElement("div"); grid.className = "dc-tgrid";
      grid.style.gridTemplateColumns = "repeat(" + cols + ",1fr)";
      for (var r = 0; r < rows; r++) for (var c = 0; c < cols; c++) {
        var inp = document.createElement("input"); inp.className = "dc-tcell"; inp.type = "text";
        inp.value = (data[r] && data[r][c] != null) ? data[r][c] : "";
        if (header && r === 0) inp.classList.add("dc-th");
        grid.appendChild(inp);
      }
      box.appendChild(grid);
      var act = document.createElement("div"); act.className = "dc-modal-act";
      var cancel = document.createElement("button"); cancel.type = "button"; cancel.className = "dc-btn"; cancel.textContent = "Cancel";
      var ins = document.createElement("button"); ins.type = "button"; ins.className = "dc-btn dc-btn-primary"; ins.textContent = "Insert";
      act.appendChild(cancel); act.appendChild(ins); box.appendChild(act);
      box.querySelector(".dc-thead").addEventListener("change", function (e) { readBack(); header = e.target.checked; render(); });
      Array.prototype.forEach.call(box.querySelectorAll("[data-a]"), function (b) {
        b.addEventListener("click", function () {
          readBack(); var a = b.getAttribute("data-a");
          if (a === "r+") rows = Math.min(rows + 1, 12); else if (a === "r-") rows = Math.max(rows - 1, 1);
          else if (a === "c+") cols = Math.min(cols + 1, 8); else if (a === "c-") cols = Math.max(cols - 1, 1);
          render();
        });
      });
      cancel.addEventListener("click", function () { closeModal(); });
      ins.addEventListener("click", function () {
        readBack();
        try { editorEl.editor.insertAttachment(new Trix.Attachment({ content: tableHtml(data, header), contentType: TABLE_CT })); editorEl.editor.insertLineBreak(); } catch (e) {}
        closeModal();
      });
    }
    // Ask the host to grow the (short inline) composer so the modal isn't clipped, and
    // shrink it back when the modal closes.
    function closeModal() { if (back.parentNode) document.body.removeChild(back); post({ type: "grow", on: 0 }); editorEl.focus(); }
    render(); document.body.appendChild(back); post({ type: "grow", on: 1 });
    var first = box.querySelector(".dc-tcell"); if (first) first.focus();
  }

  // Add the colour + HR controls INTO the Trix toolbar (matches the web dcamp
  // composer), so every context — inline chat/DM AND full compose — gets them in
  // the same place instead of a separate SwiftUI button row below the editor.
  // Same swatch palettes as the web composer (dcamp.js FG_SWATCHES / BG_SWATCHES).
  var FG_SWATCHES = ["#1c1c1c", "#6b6b6b", "#e11d48", "#ea580c", "#ca8a04", "#16a34a", "#0ea5e9", "#2563eb", "#7c3aed"];
  var BG_SWATCHES = ["#fef08a", "#bbf7d0", "#bae6fd", "#fbcfe8", "#fecaca", "#e9d5ff", "#fed7aa", "#e5e7eb"];
  // A monochrome paintbrush icon (the web uses Font Awesome fa-brush; the editor
  // bundle ships no icon font, so this SVG matches the toolbar's other mono icons
  // rather than the coloured 🖌 emoji John flagged).
  var BRUSH_SVG = '<svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor" aria-hidden="true"><path d="M7 14c-1.66 0-3 1.34-3 3 0 1.31-1.16 2-2 2 .92 1.22 2.49 2 4 2 2.21 0 4-1.79 4-4 0-1.66-1.34-3-3-3zM20.71 4.63l-1.34-1.34c-.39-.39-1.02-.39-1.41 0L9 12.25 11.75 15l8.96-8.96c.39-.39.39-1.02 0-1.41z"/></svg>';
  var TABLE_SVG = '<svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor" aria-hidden="true"><path d="M3 3h18v18H3V3zm2 2v3h4V5H5zm6 0v3h8V5h-8zM5 10v3h4v-3H5zm6 0v3h8v-3h-8zM5 15v4h4v-4H5zm6 0v4h8v-4h-8z"/></svg>';
  var ATTACH_SVG = '<svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor" aria-hidden="true"><path d="M16.5 6v11.5a4 4 0 1 1-8 0V5a2.5 2.5 0 0 1 5 0v10.5a1 1 0 1 1-2 0V6H10v9.5a2.5 2.5 0 0 0 5 0V5a4 4 0 1 0-8 0v12.5a5.5 5.5 0 0 0 11 0V6h-1.5z"/></svg>';
  // YouTube URL detector for the link-dialog "Embed" button (ported from dcamp.js ytInfo).
  function ytInfo(url) {
    if (!url) return null;
    if (/youtube\.com\/shorts\/[\w-]{6,}/.test(url)) return { yt: 1 };
    if (/youtube\.com\/watch\?[^"'\s]*\bv=[\w-]{6,}/.test(url)) return { yt: 1 };
    if (/youtu\.be\/[\w-]{6,}/.test(url)) return { yt: 1 };
    if (/youtube\.com\/embed\/[\w-]{6,}/.test(url)) return { yt: 1 };
    return null;
  }

  // Enrich Trix's built-in link dialog (href field + Link + Unlink) with the web composer's
  // extra buttons (dcamp.js trixAddGo): Go (open the URL), Revert to URL (link text → bare URL),
  // and Embed (YouTube → a titled self-link that renders as an inline player on the read view).
  function addLinkDialogButtons() {
    var dlg = editorEl.toolbarElement && editorEl.toolbarElement.querySelector('[data-trix-dialog="href"]');
    var grp = dlg && dlg.querySelector(".trix-button-group");
    if (!grp || grp.querySelector(".dc-go-btn")) return;
    var ed = editorEl.editor;
    function hrefVal() { var i = dlg.querySelector('input[name="href"]'); return i && (i.value || "").trim(); }
    // Go — open the URL being edited in a new tab.
    var go = document.createElement("input");
    go.type = "button"; go.value = "Go"; go.className = "trix-button trix-button--dialog dc-go-btn";
    go.addEventListener("click", function () {
      var u = hrefVal();
      if (u && !/^(javascript|data):/i.test(u)) window.open(u, "_blank", "noopener");
    });
    grp.appendChild(go);
    // Revert to URL — replace the link's visible text (e.g. an auto-linked page title) with the
    // bare URL, kept as a self-link so it stays clickable.
    var rev = document.createElement("input");
    rev.type = "button"; rev.value = "Revert to URL"; rev.className = "trix-button trix-button--dialog dc-revert-btn";
    rev.addEventListener("mousedown", function (e) {
      e.preventDefault();
      var u = hrefVal(); if (!u) return;
      var r = null; try { r = ed.getSelectedRange(); } catch (x) {}
      var unlink = dlg.querySelector('[data-trix-method="removeAttribute"]');
      if (unlink) unlink.click(); else { try { ed.deactivateAttribute("href"); } catch (x) {} }
      if (r && r[1] > r[0]) {
        try {
          ed.setSelectedRange(r);
          ed.insertHTML('<a href="' + esc(u) + '">' + esc(u) + "</a>");
          var caret = r[0] + u.length; ed.setSelectedRange([caret, caret]);
          try { ed.deactivateAttribute("href"); } catch (x) {}
        } catch (x) {}
      }
    });
    grp.appendChild(rev);
    // Embed (YouTube only) — make it a self-link, then ask the host for the page title (same
    // bridge as paste-URL) so the read view renders it as an inline player. Hidden for non-YouTube.
    var emb = document.createElement("input");
    emb.type = "button"; emb.value = "Embed"; emb.className = "trix-button trix-button--dialog dc-embed-btn";
    emb.style.display = "none";
    emb.addEventListener("mousedown", function (e) {
      e.preventDefault();
      var u = hrefVal(); if (!u || !ytInfo(u)) return;
      var r = null; try { r = ed.getSelectedRange(); } catch (x) {}
      if (!r) return;
      var unlink = dlg.querySelector('[data-trix-method="removeAttribute"]');
      if (unlink) unlink.click(); else { try { ed.deactivateAttribute("href"); } catch (x) {} }
      try {
        ed.setSelectedRange(r);
        ed.insertHTML('<a href="' + esc(u) + '">' + esc(u) + "</a>");
        var caret = r[0] + u.length; ed.setSelectedRange([caret, caret]);
        try { ed.deactivateAttribute("href"); } catch (x) {}
        post({ type: "urltitle", url: u });   // host fetches title → dcampSwapUrlTitle → embeds on view
      } catch (x) {}
    });
    grp.insertBefore(emb, grp.firstChild);   // to the LEFT of Link
    var href = dlg.querySelector('input[name="href"]');
    if (href) {
      var syncEmbed = function () { emb.style.display = ytInfo((href.value || "").trim()) ? "" : "none"; };
      href.addEventListener("input", syncEmbed);
      href.addEventListener("focus", syncEmbed);
      syncEmbed();
    }
  }

  function buildToolbar() {
    var tb = editorEl.toolbarElement;
    if (!tb || tb.querySelector(".dc-color-btn")) return;   // once only
    var blk = tb.querySelector(".trix-button-group--block-tools");
    var txt = tb.querySelector(".trix-button-group--text-tools") || blk;

    // — horizontal rule —
    if (blk) {
      var hr = document.createElement("button");
      hr.type = "button"; hr.className = "trix-button trix-hr-btn";
      hr.title = "Horizontal rule"; hr.tabIndex = -1; hr.textContent = "―";
      hr.addEventListener("mousedown", function (e) { e.preventDefault(); dcampInsertHR(); });
      blk.appendChild(hr);

      // — insert table (web parity: trixAddTable) —
      var tb2 = document.createElement("button");
      tb2.type = "button"; tb2.className = "trix-button trix-table-btn";
      tb2.title = "Insert table"; tb2.tabIndex = -1; tb2.innerHTML = TABLE_SVG;
      tb2.addEventListener("mousedown", function (e) { e.preventDefault(); openTableEditor(); });
      blk.appendChild(tb2);

      // — attach image (host handles it: posts "attach" → native photo picker → upload → dcampInsertImage) —
      var att = document.createElement("button");
      att.type = "button"; att.className = "trix-button dc-attach-btn";
      att.title = "Attach file"; att.tabIndex = -1; att.innerHTML = ATTACH_SVG;
      att.addEventListener("mousedown", function (e) { e.preventDefault(); post({ type: "attach" }); });
      blk.appendChild(att);
    }
    if (!txt) return;

    // — text colour & highlight —
    var cb = document.createElement("button");
    cb.type = "button"; cb.className = "trix-button dc-color-btn";
    cb.title = "Text colour & highlight"; cb.tabIndex = -1; cb.innerHTML = BRUSH_SVG;
    txt.appendChild(cb);

    var pop = document.createElement("div");
    pop.className = "dc-color-pop";
    function row(cue, hexes, chan) {
      var r = document.createElement("div"); r.className = "dc-row";
      var c = document.createElement("span"); c.className = "dc-cue"; c.textContent = cue; r.appendChild(c);
      hexes.forEach(function (hex) {
        var s = document.createElement("button");
        s.type = "button"; s.className = "dc-sw"; s.style.background = hex; s.title = hex;
        s.addEventListener("mousedown", function (e) {
          e.preventDefault();
          if (chan === "fg") dcampSetColor(hex, null); else dcampSetColor(null, hex);
          pop.classList.remove("open");
        });
        r.appendChild(s);
      });
      if (chan === "bg") {
        var clr = document.createElement("button");
        clr.type = "button"; clr.className = "dc-clear"; clr.textContent = "Clear";
        clr.addEventListener("mousedown", function (e) { e.preventDefault(); dcampClearColor(); pop.classList.remove("open"); });
        r.appendChild(clr);
      }
      return r;
    }
    pop.appendChild(row("A", FG_SWATCHES, "fg"));    // "A" cues text colour
    pop.appendChild(row("▉", BG_SWATCHES, "bg"));    // filled block cues highlight
    document.body.appendChild(pop);

    cb.addEventListener("mousedown", function (e) {
      e.preventDefault();
      var open = !pop.classList.contains("open");
      // anchor just ABOVE the bottom toolbar (short editor → don't risk clipping off the button's x)
      pop.style.bottom = (tb.offsetHeight + 2) + "px"; pop.style.top = "auto";
      pop.classList.toggle("open", open);
    });
    document.addEventListener("mousedown", function (e) {
      if (e.target !== cb && !pop.contains(e.target)) pop.classList.remove("open");
    });
  }

  // --- markdown auto-format as you type (ported from dcamp.js attachMarkdown) ---
  // When the user completes a markdown pattern, swap the raw markdown for real
  // rich-text formatting in place. Block markers fire on the trailing space;
  // inline markers fire on the closing delimiter.
  var mdBusy = false;
  var INLINE = [
    { re: /\*\*([^*\n]+)\*\*$/, attr: "bold", d: 2 },
    { re: /__([^_\n]+)__$/, attr: "bold", d: 2 },
    { re: /~~([^~\n]+)~~$/, attr: "strike", d: 2 },
    { re: /(?:^|[^*\w])\*([^*\n]+)\*$/, attr: "italic", d: 1, g: 1 },
    { re: /(?:^|[^_\w])_([^_\n]+)_$/, attr: "italic", d: 1, g: 1 }
  ];
  function runMarkdown() {
    var ed2 = editorEl.editor; if (!ed2 || mdBusy) return;
    var r = ed2.getSelectedRange(); if (r[0] !== r[1]) return;   // collapsed caret only
    var caret = r[1];
    var before = ed2.getDocument().toString().slice(0, caret);
    var line = before.slice(before.lastIndexOf("\n") + 1);
    // ``` on its own line → code block (Trix has no inline code).
    if (line === "```" && !ed2.attributeIsActive("code")) {
      mdBusy = true;
      try { ed2.setSelectedRange([caret - 3, caret]); ed2.deleteInDirection("backward"); ed2.activateAttribute("code"); }
      finally { mdBusy = false; }
      return;
    }
    var blk = /^#{1,3}\s$/.test(line) ? "heading1"
      : /^[-*]\s$/.test(line) ? "bullet"
      : /^\d+\.\s$/.test(line) ? "number"
      : /^>\s$/.test(line) ? "quote" : null;
    if (blk) {
      var ls = caret - line.length;
      mdBusy = true;
      try { ed2.setSelectedRange([ls, caret]); ed2.deleteInDirection("backward"); ed2.activateAttribute(blk); }
      finally { mdBusy = false; }
      return;
    }
    for (var i = 0; i < INLINE.length; i++) {
      var m = before.match(INLINE[i].re); if (!m) continue;
      var inner = INLINE[i].g ? m[INLINE[i].g] : m[1];
      var s = caret - (inner.length + 2 * INLINE[i].d);
      var attr = INLINE[i].attr;
      mdBusy = true;
      try {
        ed2.setSelectedRange([s, caret]); ed2.insertString(inner);
        ed2.setSelectedRange([s, s + inner.length]); ed2.activateAttribute(attr);
        ed2.setSelectedRange([s + inner.length, s + inner.length]); ed2.deactivateAttribute(attr);
      } finally { mdBusy = false; }
      return;
    }
    var lm = before.match(/\[([^\]\n]+)\]\(([^)\s]+)\)$/);
    if (lm) {
      var s2 = caret - lm[0].length;
      mdBusy = true;
      try {
        ed2.setSelectedRange([s2, caret]);
        ed2.insertHTML('<a href="' + esc(lm[2]) + '">' + esc(lm[1]) + "</a>");
        try { ed2.deactivateAttribute("href"); } catch (e) {}
      } finally { mdBusy = false; }
    }
  }
  editorEl.addEventListener("trix-change", runMarkdown);

  // --- paste a bare URL → link to the page <title> (ported from dcamp.js) ---
  function isBareUrl(s) { return /^https?:\/\/\S+$/i.test(s) && !/\s/.test(s) && s.length <= 2000; }
  var pasteStart = null;
  editorEl.addEventListener("paste", function () {
    try { pasteStart = editorEl.editor.getSelectedRange()[0]; } catch (e) { pasteStart = null; }
  }, true);
  editorEl.addEventListener("trix-paste", function (e) {
    var p = e.paste || {}, ed2 = editorEl.editor, start = pasteStart; pasteStart = null;
    if (!ed2 || p.html || start == null) return;           // rich paste → leave to Trix
    var s = (p.string || "").trim();
    if (!isBareUrl(s)) return;
    var end = ed2.getSelectedRange()[1];
    if (end > start) {                                     // link the raw URL to itself at once
      mdBusy = true;
      try { ed2.setSelectedRange([start, end]); ed2.insertHTML('<a href="' + esc(s) + '">' + esc(s) + "</a>"); try { ed2.deactivateAttribute("href"); } catch (x) {} }
      finally { mdBusy = false; }
    }
    post({ type: "urltitle", url: s });                    // Swift fetches the title, then swaps it in
  });
  // Swift calls this once url_title returns: swap the visible URL text for the page title.
  window.dcampSwapUrlTitle = function (url, title) {
    if (!title) return;
    var ed2 = editorEl.editor; if (!ed2) return;
    var full; try { full = ed2.getDocument().toString(); } catch (e) { return; }
    var idx = full.indexOf(url); if (idx < 0) return;
    mdBusy = true;
    try {
      ed2.setSelectedRange([idx, idx + url.length]);
      ed2.insertHTML('<a href="' + esc(url) + '">' + esc(title) + "</a>");
      var caret = idx + title.length; ed2.setSelectedRange([caret, caret]);
      try { ed2.deactivateAttribute("href"); } catch (e) {}
    } finally { mdBusy = false; }
  };

  // Called by the host after it uploads an image via the native API.
  window.dcampInsertImage = function (url) {
    var attachment = new Trix.Attachment({
      url: url, href: url, contentType: "image",
      content: '<img src="' + url + '">'
    });
    editorEl.editor.insertAttachment(attachment);
    editorEl.focus();
  };

  // Called by the host after it uploads a NON-image file — insert a download link (the
  // "dc-file" convention the read view + web recognise; video files render as inline players).
  window.dcampInsertFile = function (url, name, mime) {
    var label = name || "file";
    var content = '<a class="dc-file" href="' + url + '" download>' + esc(label) + '</a>';
    var attachment = new Trix.Attachment({ url: url, href: url, filename: label, contentType: mime || "", content: content });
    editorEl.editor.insertAttachment(attachment);
    editorEl.editor.insertLineBreak();
    editorEl.focus();
  };

  // Called by Swift to read the current HTML on demand.
  window.dcampGetHTML = function () {
    // WebKit/Catalyst stamps the editor's DEFAULT text colour as an inline style on
    // typed spans (e.g. color: rgba(0,0,0,0.847)); that then renders black-on-blue in
    // a "mine" DM/chat bubble (and would on the web too). Strip default near-black /
    // near-white colour declarations so only deliberately-picked palette colours (hex)
    // survive.
    var tmp = document.createElement("div");
    tmp.innerHTML = input.value;
    Array.prototype.forEach.call(tmp.querySelectorAll('[style*="color"]'), function (el) {
      var c = ((el.style && el.style.color) || "").replace(/\s+/g, "").toLowerCase();
      var m = c.match(/^rgba?\((\d+),(\d+),(\d+)/);
      var nearBlack = c === "black" || (m && +m[1] < 20 && +m[2] < 20 && +m[3] < 20);
      var nearWhite = c === "white" || (m && +m[1] > 235 && +m[2] > 235 && +m[3] > 235);
      if (nearBlack || nearWhite) {
        el.style.removeProperty("color");
        if (!el.getAttribute("style")) el.removeAttribute("style");
      }
    });
    return tmp.innerHTML;
  };

  // Called by Swift to focus the editor.
  window.dcampFocus = function () { editorEl.focus(); };

  // Called by Swift to clear the editor after sending.
  window.dcampClear = function () { editorEl.editor.loadHTML(""); };

  // Called by Swift to preload existing content (edit mode).
  window.dcampLoadHTML = function (h) { try { editorEl.editor.loadHTML(h || ""); } catch (e) {} };

  // Called by the host for "Quote & reply": append a pre-built quote (attribution + blockquote,
  // matching dcamp.js) at the end of the composer, then break out onto a fresh line.
  window.dcampInsertQuote = function (h) {
    var ed = editorEl.editor;
    try {
      editorEl.focus();
      var len = ed.getDocument().getLength();
      ed.setSelectedRange([len, len]);
      if ((input.value || "").trim()) ed.insertLineBreak();
      ed.insertHTML(h || "");
      ed.insertLineBreak();
      ed.insertLineBreak();
    } catch (e) {}
    editorEl.focus();
  };

  // Called by Swift to set the placeholder text.
  // Called by the host when its appearance changes: {dark, ink, soft, panel, line, link, accent} (hex "#rrggbb").
  window.dcampSetTheme = function (t) {
    var r = document.documentElement;
    if (t.dark) r.setAttribute("data-theme", "dark"); else r.removeAttribute("data-theme");
    ["ink", "soft", "panel", "line", "link", "accent"].forEach(function (k) { if (t[k]) r.style.setProperty("--dc-" + k, t[k]); });
  };
  window.dcampSetPlaceholder = function (t) { editorEl.setAttribute("placeholder", t); };

  // --- @mention autocomplete ---------------------------------------------
  var mentionStart = -1;  // document offset of the "@" currently being typed

  function scanMention() {
    var ed = editorEl.editor;
    var range = ed.getSelectedRange();
    if (!range || range[0] !== range[1]) { mentionStart = -1; return null; }
    var caret = range[0];
    var text = ed.getDocument().toString();
    var i = caret - 1;
    while (i >= 0) {
      var ch = text[i];
      if (ch === "@") {
        var before = i > 0 ? text[i - 1] : " ";
        if (/\s|[()\[\]]/.test(before) || i === 0) {
          var q = text.substring(i + 1, caret);
          if (/^[\w .'-]*$/.test(q)) { mentionStart = i; return q; }
        }
        break;
      }
      if (/\s/.test(ch)) break;
      i--;
    }
    mentionStart = -1;
    return null;
  }

  editorEl.addEventListener("trix-selection-change", function () {
    var q = scanMention();
    post({ type: "mention", q: q });
  });

  // Called by Swift when a mention is chosen: replace the "@query" with a link.
  window.dcampInsertMention = function (id, name) {
    var ed = editorEl.editor;
    if (mentionStart < 0) return;
    var caret = ed.getSelectedRange()[0];
    ed.setSelectedRange([mentionStart, caret]);
    ed.insertHTML('<a href="#/p/' + id + '">@' + name + '</a> ');
    mentionStart = -1;
    post({ type: "mention", q: null });
    editorEl.focus();
  };
  // catch-up: Trix already initialised before our listener existed (see onTrixInit)
  if (editorEl.editor) onTrixInit();
</script>
